<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ce1126" />
    <title>مفيش اتصال بالإنترنت، من أجل مصر</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #fff;
        color: #111;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 480px;
        margin: 15vh auto 0;
        padding: 28px;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        font-size: 27px;
        line-height: 1.6;
      }
      p {
        color: #666;
        font-size: 16px;
        line-height: 1.9;
      }
      a {
        display: inline-block;
        padding: 12px 20px;
        margin-top: 12px;
        border-radius: 6px;
        background: #ce1126;
        color: #fff;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 4px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #141414;
          color: #f5f5f7;
        }
        p {
          color: #aaa;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img
        src="/icons/icon-192.png"
        alt="شعار من أجل مصر"
        width="72"
        height="72"
      />
      <h1>مفيش اتصال بالإنترنت دلوقتي</h1>
      <p>
        وصّل الإنترنت وافتح الموقع تاني. تسجيل المشاركة، الحضور وتعديل بياناتك
        محتاجين اتصال عشان نتأكد إنهم اتحفظوا.
      </p>
      <p>
        لو كنت بتسجّل حضورك وقت ما الاتصال فصل، افتح الفعالية وتأكد إن الحضور
        اتسجّل، أو امسح الرمز تاني بعد رجوع الإنترنت.
      </p>
      <a href="/">جرّب تاني</a>
    </main>
  </body>
</html>
